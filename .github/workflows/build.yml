name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do sistema (Qt + X virtual)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1
      - name: Dependências
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps pynput
          python -m pip install --no-deps -e .
      - name: Testes (incluindo o backend real em X11 virtual)
        run: xvfb-run -a python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps pynput
          python -m pip install --no-deps -e .
      - name: Testes
        run: python -m pytest -q -m "not x11"
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Gerar executável
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/automacro.spec
      - name: Compactar
        run: Compress-Archive -Path dist/AutoMacro -DestinationPath AutoMacro-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: AutoMacro-windows
          path: AutoMacro-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AutoMacro-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: AutoMacro-windows.zip
